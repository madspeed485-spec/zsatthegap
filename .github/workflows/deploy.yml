name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Actions deploys ignore a CNAME file. The workflow token has pages:write;
      # the cloud-agent token cannot update Pages settings.
      - name: Set custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pages" \
            -f cname='zsatthegap.com' \
            --jq '{cname,html_url,https_enforced}'
